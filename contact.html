<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Slider & Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./scss/style.css">

</head>
<body class="text-pink-300 bg-black bg-opacity-80 font-sans"> 

  <div id="tsparticles"></div>

  <div class="slider-container">
    <!-- container for the image slider for the projects -->
    <div class="slider w-12 h-12">
      <img src="./images/website.png" alt="JQuery tester" style="width: 800px; height: 400px; object-fit: cover;">
      <img src="./images/website2.png" alt="Slide 2" style="width: 800px; height: 400px; object-fit: cover;">
      <img src="./images/pokemon.png" alt="Slide 3" style="width: 800px; height: 400px; object-fit: cover;">
    </div>
  </div>

  <div class="container mx-auto">
    <!-- this is the container for the contact form and also with the use of email js  -->
    <div class="contact-form">
      <h2>Contact Us</h2>
      <form id="contact-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>

    <div class="contact-form" style="color: palevioletred; margin-top: 2rem;">
      <h3 class="text-pink-600 text-2xl font-bold mb-3">My Skills</h3>
      <p class="text-pink-300 mb-5 flex auto">Click to find out more about my skills</p>
      <button onclick="window.location.href='about.html'" 
        class="w-full bg-pink-600 text-white py-3 px-6 rounded-md font-bold hover:bg-pink-500 transition-all duration-300">
        See my Skills
      </button>
      <!-- this is the button that click it will take the user to the skills page -->
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    emailjs.init("ZOiyVtgIE4bFUkvq9");// adding the emial js with the user id that is provided by email js

    document.getElementById("contact-form").addEventListener("submit", function (e) {//getting the value of the user from the contact for and adding the following function to it as an event listener
      e.preventDefault();
      emailjs.sendForm("service_8s9yf3g", "template_bgm3uds", this)//using the template and service name provided by email js to get the email and send it to the contact form users email
        .then(function () {
          alert("Message sent successfully!");
        }, function (error) {
          alert("Failed to send message. Please try again later.");
          console.error(error);
        });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
  <!-- implementing the ts particle  -->
  <script>
    tsParticles.load("tsparticles", {
      //this will be the stuff for the particle using what is readably available from the ts particle website
      background: { color: "#000000" },
      // this is the background color of the particles
      fpsLimit: 60,//hhow ast the pasrticles are moving
      interactivity: {//this will shwo how the hovering 
        events: { onHover: { enable: true, mode: "bubble" }, resize: true },//this is the hover effect that if the user hovers over the particles it will bubble up
        modes: { bubble: { distance: 150, size: 8, duration: 2, opacity: 0.8, speed: 100 } } //this is the distance that the particles will move when the user hovers over them
      },
      particles: {
        color: { value: "#ff007f" },//this is the color of the particles
        links: { enable: false },//this is the link between the particles and make sure therer is nothign attached to them
        move: {//this is the movement of the particles
          direction: "top",//this is the direction of the particles
          enable: true,//this is the enablement of the particles
          outModes: { default: "out" },//this is the out mode of the particles
          random: true,//this is the random movement of the particles
          speed: 1,//this is the speed of the particles
          straight: false//this is the straight movement of the particles and make sure its random 
        },
        number: { value: 100, density: { enable: true, area: 800 } },//this is the number of particles and the density of the particles
        opacity: { value: 0.6, random: true },//this is the opacity of the particles
        shape: { type: "circle" },//this is the shape of the particles
        size: { value: { min: 2, max: 6 } }//this is the size of the particles
      },
    
    });
  </script>


  <script>
    // jQuery for the image slider
    $(document).ready(function () {
      let currentIndex = 0;//starting at the frist image which is the index of 0
      const slides = $(".slider img");//getting locaation from the html 
      const totalSlides = slides.length;//finding the max length by seing how muhc sliders aare at the location in the html 

      function showSlide(index) {
        slides.hide();//hiding all he other sliders 
        slides.eq(index).fadeIn();//fading in the current index using the eq function which is getting the index of the current image
      }

      function nextSlide() {//this will be the moving to the next slide 
        currentIndex = (currentIndex + 1) % totalSlides;//adding the one to thecurrent index and modulo the total slides to make sure it goes back to the start
        showSlide(currentIndex);//then we call the fucntion before to faded it in and hide everyhtign else 
      }

      

     

      showSlide(currentIndex);//showing the first slide
      setInterval(nextSlide, 3000);//making it go to the next slider every 3 sec as the timer
    });
  </script>
</body>
</html>
